<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-itunes-app" content="app-id=6814234005">
<title>SOURCE!</title>
<meta name="description" content="Take Back Your Morning">
<meta property="og:title" content="SOURCE! — Take Back Your Morning">
<meta property="og:description" content="No billionaire algorithm. Support the people who report the news.">
<meta property="og:image" content="https://news-for-38-year-olds.onrender.com/source/source-og.png">
<meta property="og:url" content="https://news-for-38-year-olds.onrender.com/source/">
<meta property="og:type" content="website">
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:title" content="SOURCE! — Take Back Your Morning">
<meta name="twitter:description" content="No billionaire algorithm. Support the people who report the news.">
<meta name="twitter:image" content="https://news-for-38-year-olds.onrender.com/source/source-og.png">
<link rel="manifest" href="/source/manifest.json">
<meta name="theme-color" content="#FFFFFF">
<link rel="icon" href="/source/icons/icon-192.png">
<link rel="apple-touch-icon" href="/source/icons/icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/source/source.css">
</head>
<body>
  <header class="source-header">
    <div class="wordmark-wrap">
      <div class="wordmark">SOURCE<span class="wordmark-bang">!</span></div>
      <div class="wordmark-rule"></div>
      <div class="tagline">Take Back Your Morning</div>
    </div>
    <div class="header-actions">
      <button class="icon-btn" id="searchBtn" title="Search" aria-label="Search recent headlines" aria-expanded="false">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"/><line x1="16.5" y1="16.5" x2="21" y2="21"/></svg>
      </button>
      <button class="icon-btn" id="refreshBtn" title="Refresh" aria-label="Refresh">⟳</button>
      <button class="icon-btn" id="feedsBtn" title="Customize my feed" aria-label="Customize my feed">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" aria-hidden="true"><line x1="4" y1="7" x2="20" y2="7"/><circle cx="9" cy="7" r="2.4" fill="var(--surface)"/><line x1="4" y1="17" x2="20" y2="17"/><circle cx="15" cy="17" r="2.4" fill="var(--surface)"/></svg>
      </button>
      <div class="view-menu" id="viewMenu"></div>
    </div>
  </header>

  <div id="getAppStrip" class="get-app-strip" hidden></div>

  <!-- Client-only "since you last opened this" signal — see updateLiveStrip()
       in source.js. Never affects ordering or ranking, purely a local count
       computed from what's already loaded; hidden entirely on a reader's
       first-ever visit (nothing to compare against yet). -->
  <div class="live-strip" id="liveStrip" hidden>
    <span class="pulse" aria-hidden="true"></span>
    <span id="liveStripText"></span>
    <button type="button" class="rel-toggle" id="relToggle" hidden aria-label="Sort by relevance">
      <span class="rel-toggle-label">Sort by relevance</span>
      <span class="rel-switch" id="relSwitch" role="switch" aria-checked="false"><span class="rel-knob"></span></span>
    </button>
  </div>

  <div class="spray-toggle" id="sprayToggle" hidden></div>
  <div class="read-promise-caption" id="readPromiseCaption" hidden>Sorted by time. Nothing hidden.</div>

  <!-- Desktop-only: persistent right-hand side panel filling the dead
       space beyond the centered main column on wide screens. A stack of
       small stat/context modules (midterms countdown, Iran War day
       counter, gas price, climate metrics, top Bluesky post) — hidden
       entirely on Mobile layout and narrower widths via CSS. Reader can
       hide the whole panel or individual modules via the gear icon;
       always collapses to just its header (never fully vanishes) so
       that control stays reachable.

       Wrapped together with #main in .source-body-row (a real flex
       row) rather than using position:fixed for the panel — this way
       the browser's own flex layout keeps them from ever overlapping,
       and #main automatically reclaims the panel's space the moment
       it's hidden (display:none removes it from the flex row
       entirely), instead of relying on manually-computed CSS
       reservations that have to be kept in sync by hand. -->
  <div class="source-body-row" id="sourceBodyRow">
    <main class="source-main" id="main"><div class="source-single-col-screen source-splash pre" aria-hidden="true"><div class="splash-mark">SOURCE<span class="splash-bang">!</span></div><div class="splash-rule"></div><h2 class="splash-line">You&rsquo;re going straight to the source.</h2></div></main>
    <div class="pane-resizer today-panel-resizer" id="todayPanelResizer" title="Drag to resize" hidden></div>
    <aside class="desktop-side-panel" id="desktopSidePanel" hidden></aside>
  </div>

  <nav class="tab-bar" id="tabBar"></nav>

  <div id="toast"></div>

  <!-- Review-only control: switches the Mobile/Desktop LAYOUT preview.
       Lives outside the app frame itself (position:fixed to the real
       browser viewport, only shown at desktop widths) — this is for
       looking at the app during development/demos, not a setting a
       real reader sees or uses inside the product. -->
  <div class="layout-review" id="layoutReview"></div>

  <script src="/source/vendor/capacitor-app-plugin.js"></script>
  <script src="/source/vendor/capacitor-browser-plugin.js"></script>
  <script src="/source/source.js"></script>
</body>
</html>
